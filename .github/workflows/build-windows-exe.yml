name: Build Nexus Windows EXE

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build self-contained Windows x64 app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET 10 LTS SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Nexus.Desktop/Nexus.Desktop.csproj --runtime win-x64

      - name: Build Release
        run: dotnet build Nexus.Desktop/Nexus.Desktop.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish single-file EXE
        run: >-
          dotnet publish Nexus.Desktop/Nexus.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/Nexus-win-x64

      - name: Package downloadable ZIP
        shell: pwsh
        run: |
          if (!(Test-Path "artifacts/Nexus-win-x64/Nexus.exe")) {
            throw "Publish did not produce Nexus.exe."
          }
          Compress-Archive -Path "artifacts/Nexus-win-x64/Nexus.exe" -DestinationPath "artifacts/Nexus-Windows-x64.zip" -Force

      - name: Commit EXE to repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item "artifacts/Nexus-win-x64/Nexus.exe" "dist/Nexus.exe" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "dist/Nexus.exe"

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "dist/Nexus.exe is already up to date."
          } else {
            git commit -m "build: update Nexus Windows executable [skip ci]"
            if ($LASTEXITCODE -ne 0) {
              throw "Could not commit the generated executable."
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              throw "Could not push the generated executable to main."
            }
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Nexus-Windows-x64
          path: |
            artifacts/Nexus-win-x64/Nexus.exe
            artifacts/Nexus-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/Nexus-Windows-x64.zip
